name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Image to GHCR
    permissions:
      contents: read
      packages: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow run commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          target: final
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}

  deploy-academy:
    name: Deploy no EKS (AWS Academy)
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.session.outputs.available }}
    # Roda depois de um CI verde na main ou manualmente (Run workflow). Se a sessão do lab estiver
    # desligada ou as credenciais tiverem expirado, o job só avisa e termina sem falhar.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    concurrency:
      group: deploy-academy-car-repair-production-service
      cancel-in-progress: false
    env:
      SERVICE: car-repair-production-service
      NAMESPACE: car-repair
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'car-repair-dev' }}
      IMAGE_TAG: ${{ github.sha }}
      # Credenciais temporárias do AWS Academy (AWS Details > AWS CLI), atualizadas a cada sessão
      # por car-repair-k8s-infra/scripts/academy-github-credentials.sh.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      # Sem ref vinda do evento: o deploy usa o commit atual da main (github.sha), nunca código de um fork.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sessão do AWS Academy
        id: session
        shell: bash
        run: |
          skip() {
            echo "::notice title=Deploy pulado::$1"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ -n "${AWS_ACCESS_KEY_ID}" ] || skip "Secrets AWS_* não configurados neste repositório."
          aws sts get-caller-identity >/dev/null 2>&1 || skip "Credenciais do AWS Academy expiradas. Suba o lab e rode academy-github-credentials.sh."
          aws eks describe-cluster --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1 \
            || skip "Cluster ${EKS_CLUSTER_NAME} não existe nesta sessão do lab."

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Publicar imagem no ECR
        if: steps.session.outputs.available == 'true'
        shell: bash
        env:
          REGISTRY: ${{ steps.session.outputs.registry }}
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY}"

          # As tags do ECR são imutáveis: um redeploy do mesmo commit reaproveita a imagem.
          if aws ecr describe-images --repository-name "${SERVICE}" --image-ids "imageTag=${IMAGE_TAG}" \
            --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "Imagem ${SERVICE}:${IMAGE_TAG} já está no ECR."
            exit 0
          fi

          docker build --file src/Api/Dockerfile --tag "${REGISTRY}/${SERVICE}:${IMAGE_TAG}" .
          docker push "${REGISTRY}/${SERVICE}:${IMAGE_TAG}"

      - name: Configurar kubectl
        if: steps.session.outputs.available == 'true'
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Conferir plataforma
        if: steps.session.outputs.available == 'true'
        shell: bash
        run: |
          if ! kubectl -n "${NAMESPACE}" get secret rabbitmq >/dev/null 2>&1; then
            echo "::error::A plataforma (bancos e RabbitMQ) não está no cluster. Rode o workflow Platform do car-repair-k8s-infra antes."
            exit 1
          fi

      - name: Aplicar manifests
        if: steps.session.outputs.available == 'true'
        shell: bash
        env:
          REGISTRY: ${{ steps.session.outputs.registry }}
        run: |
          kubectl kustomize k8s/overlays/academy-dev \
            | sed "s|image: ${SERVICE}:latest|image: ${REGISTRY}/${SERVICE}:${IMAGE_TAG}|" \
            > /tmp/manifests.yaml
          grep -q "image: ${REGISTRY}/${SERVICE}:${IMAGE_TAG}" /tmp/manifests.yaml
          kubectl apply -f /tmp/manifests.yaml

      - name: Aguardar rollout
        if: steps.session.outputs.available == 'true'
        shell: bash
        run: |
          if ! kubectl -n "${NAMESPACE}" rollout status "deployment/${SERVICE}" --timeout=300s; then
            kubectl -n "${NAMESPACE}" get pods -l "app.kubernetes.io/name=${SERVICE}"
            kubectl -n "${NAMESPACE}" logs "deployment/${SERVICE}" --tail=100 || true
            exit 1
          fi

  deploy-kind:
    name: Deploy no Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: deploy-academy
    # Sem o EKS do AWS Academy disponível, o deploy acontece num cluster kind criado no próprio runner:
    # mesma imagem, mesmos manifests (k8s/overlays/academy-dev) e mesma plataforma (bancos e RabbitMQ
    # do car-repair-k8s-infra), com rollout e smoke test. O cluster é descartado no fim do job.
    if: ${{ needs.deploy-academy.result == 'success' && needs.deploy-academy.outputs.deployed != 'true' }}
    timeout-minutes: 20
    env:
      SERVICE: car-repair-production-service
      NAMESPACE: car-repair
      IMAGE_TAG: ${{ github.sha }}
      SMOKE_PATH: /api/work-orders
      SMOKE_STATUS: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout da plataforma (car-repair-k8s-infra)
        uses: actions/checkout@v4
        with:
          repository: Mavidev-Solucoes/car-repair-k8s-infra
          path: .k8s-infra

      - name: Criar cluster kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: car-repair-cd

      - name: Build da imagem e carga no cluster
        run: |
          docker build --file src/Api/Dockerfile --tag "${SERVICE}:${IMAGE_TAG}" .
          kind load docker-image "${SERVICE}:${IMAGE_TAG}" --name car-repair-cd

      - name: Subir plataforma (bancos e RabbitMQ)
        run: .k8s-infra/scripts/academy-bootstrap-platform.sh

      - name: Aplicar manifests
        shell: bash
        run: |
          kubectl kustomize k8s/overlays/academy-dev \
            | sed "s|image: ${SERVICE}:latest|image: ${SERVICE}:${IMAGE_TAG}|" \
            > /tmp/manifests.yaml
          grep -q "image: ${SERVICE}:${IMAGE_TAG}" /tmp/manifests.yaml
          kubectl apply -f /tmp/manifests.yaml

      - name: Aguardar rollout
        shell: bash
        run: |
          if ! kubectl -n "${NAMESPACE}" rollout status "deployment/${SERVICE}" --timeout=300s; then
            kubectl -n "${NAMESPACE}" get pods -o wide
            kubectl -n "${NAMESPACE}" describe "deployment/${SERVICE}" | tail -30
            kubectl -n "${NAMESPACE}" logs "deployment/${SERVICE}" --tail=100 || true
            exit 1
          fi

      - name: Smoke test
        shell: bash
        run: |
          kubectl -n "${NAMESPACE}" port-forward "svc/${SERVICE}" 8080:80 >/tmp/port-forward.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT

          check() {
            local path="$1" expected="$2" status=""
            for _ in $(seq 1 30); do
              status="$(curl -s -o /tmp/body -w '%{http_code}' -H "X-User-Id: $(cat /proc/sys/kernel/random/uuid)" \
                "http://localhost:8080${path}" || true)"
              if [ "${status}" = "${expected}" ]; then
                echo "GET ${path} -> ${status}"
                return 0
              fi
              sleep 2
            done
            echo "::error::GET ${path} respondeu ${status} (esperava ${expected})"
            cat /tmp/body || true
            kubectl -n "${NAMESPACE}" logs "deployment/${SERVICE}" --tail=100 || true
            return 1
          }

          # /health inclui banco e RabbitMQ; o segundo GET passa pela API e pelo banco do serviço; o último confere o Swagger.
          check /health 200
          check "${SMOKE_PATH}" "${SMOKE_STATUS}"
          check /swagger/v1/swagger.json 200
          kubectl -n "${NAMESPACE}" get deployment,pods,svc -l "app.kubernetes.io/name=${SERVICE}"
          echo "::notice title=Deploy no kind::${SERVICE}:${IMAGE_TAG} implantado e validado no cluster kind."
